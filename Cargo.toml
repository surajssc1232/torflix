[package]
name = "torflix"
version = "0.4.6"
edition = "2021"
description = "Stream movies in your terminal from magnet links and torrents — powered by rqbit + mpv/vlc"
license = "MIT"
repository = "https://github.com/surajssc1232/torflix"
homepage = "https://github.com/surajssc1232/torflix"
readme = "README.md"
keywords = ["torrent", "streaming", "tui", "mpv", "rqbit"]
categories = ["command-line-utilities", "multimedia"]
exclude = [".claude/", "*.local.json"]

[dependencies]
ratatui = "0.26"
crossterm = "0.27"
minreq = { version = "2.11", features = ["json-using-serde", "https-rustls-probe"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "5"
librqbit = { version = "9.0.0-rc.0", features = ["http-api", "tracing-subscriber-utils"] }
librqbit-dualstack-sockets = "0.7"
openssl = { version = "0.10", features = ["vendored"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros"] }

[profile.release]
lto = true
strip = true
