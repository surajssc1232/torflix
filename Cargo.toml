[package]
name = "torflix"
version = "0.1.0"
edition = "2021"
description = "A terminal UI for streaming movies from torrents, powered by rqbit + mpv"
license = "MIT"

[dependencies]
ratatui = "0.26"
crossterm = "0.27"
minreq = { version = "2.11", features = ["json-using-serde", "https-rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "5"

[profile.release]
lto = true
strip = true
